{% extends "base.html" %}
{% block title_suffix %} - {{ name }}{% endblock %}

{% block content %}
<div class="ac-page-header">
    <h1>{{ name }}</h1>
    <p><a href="/skills">&larr; Back to Skills Library</a></p>
</div>

<div class="pf-v6-c-card">
    <div class="pf-v6-c-card__body">
        <pre class="ac-code"><code>{{ content }}</code></pre>
    </div>
</div>

<div style="margin-top:1rem;">
    <button type="button" class="pf-v6-c-button pf-m-secondary" id="btn-toggle-deploy"
            onclick="var c=document.getElementById('aap-deploy-section');c.style.display=c.style.display==='none'?'':'none';">
        Deploy to AAP
    </button>
</div>
<div id="aap-deploy-section" style="{% if not show_deploy %}display:none;{% endif %}">
    {% include "_aap_deploy_form.html" %}
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en" class="pf-v6-theme-dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnsibleClaw{% block title_suffix %}{% endblock %}</title>
    <script>
        (function() {
            var saved = localStorage.getItem('ansibleclaw-theme');
            if (saved === 'light') {
                document.documentElement.classList.remove('pf-v6-theme-dark');
            } else if (!saved && window.matchMedia('(prefers-color-scheme: light)').matches) {
                document.documentElement.classList.remove('pf-v6-theme-dark');
            }
        })();
    </script>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@patternfly/patternfly@6/patternfly.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@patternfly/patternfly@6/patternfly-addons.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <div class="pf-v6-c-page">
        <header class="ac-masthead" id="page-masthead">
            <a href="/skills" class="ac-masthead__brand">
                <img src="/static/logo.png" alt="AnsibleClaw" class="ac-nav-logo">
                <span class="ac-brand-text">AnsibleClaw</span>
            </a>
            <nav class="pf-v6-c-nav pf-m-horizontal" aria-label="Global">
                <ul class="pf-v6-c-nav__list">
                    <li class="pf-v6-c-nav__item">
                        <a href="/skills" class="pf-v6-c-nav__link{% if page == 'skills' %} pf-m-current{% endif %}" {% if page == "skills" %}aria-current="page"{% endif %}>Skills</a>
                    </li>
                    <li class="pf-v6-c-nav__item">
                        <a href="/collections" class="pf-v6-c-nav__link{% if page == 'collections' %} pf-m-current{% endif %}" {% if page == "collections" %}aria-current="page"{% endif %}>Collections</a>
                    </li>
                    <li class="pf-v6-c-nav__item">
                        <a href="/search" class="pf-v6-c-nav__link{% if page == 'search' %} pf-m-current{% endif %}" {% if page == "search" %}aria-current="page"{% endif %}>Search</a>
                    </li>
                    <li class="pf-v6-c-nav__item">
                        <a href="/generate" class="pf-v6-c-nav__link{% if page == 'generate' %} pf-m-current{% endif %}" {% if page == "generate" %}aria-current="page"{% endif %}>Generate</a>
                    </li>
                    <li class="pf-v6-c-nav__item">
                        <a href="/compose" class="pf-v6-c-nav__link{% if page == 'compose' %} pf-m-current{% endif %}" {% if page == "compose" %}aria-current="page"{% endif %}>Compose</a>
                    </li>
                    <li class="pf-v6-c-nav__item">
                        <a href="/inventory" class="pf-v6-c-nav__link{% if page == 'inventory' %} pf-m-current{% endif %}" {% if page == "inventory" %}aria-current="page"{% endif %}>Inventory</a>
                    </li>
                    <li class="pf-v6-c-nav__item">
                        <a href="/aap" class="pf-v6-c-nav__link{% if page == 'aap' %} pf-m-current{% endif %}" {% if page == "aap" %}aria-current="page"{% endif %}>AAP {% if aap_connected %}<span class="ac-aap-dot ac-aap-dot--connected" title="AAP Connected">&#9679;</span>{% elif aap_configured %}<span class="ac-aap-dot ac-aap-dot--configured" title="AAP Configured (not verified)">&#9679;</span>{% endif %}</a>
                    </li>
                </ul>
            </nav>
            <button id="theme-toggle" class="pf-v6-c-button pf-m-plain ac-theme-toggle" type="button" title="Toggle theme">
                <span class="theme-icon"></span>
                <span class="theme-label"></span>
            </button>
        </header>

        <main class="pf-v6-c-page__main" id="main-content">
            <section class="pf-v6-c-page__main-section">
                {% block content %}{% endblock %}
            </section>

            <footer class="pf-v6-c-page__main-section ac-footer">
                <small>AnsibleClaw &mdash; Ansible skill generation for AI agents</small>
            </footer>
        </main>
    </div>

    <script>
    (function() {
        var btn = document.getElementById('theme-toggle');
        var icon = btn.querySelector('.theme-icon');
        var label = btn.querySelector('.theme-label');

        function isDark() {
            return document.documentElement.classList.contains('pf-v6-theme-dark');
        }

        function applyUI() {
            if (isDark()) {
                icon.textContent = '\u25D0';
                label.textContent = 'Dark';
            } else {
                icon.textContent = '\u25D1';
                label.textContent = 'Light';
            }
        }

        function toggle() {
            var dark = isDark();
            if (dark) {
                document.documentElement.classList.remove('pf-v6-theme-dark');
                localStorage.setItem('ansibleclaw-theme', 'light');
            } else {
                document.documentElement.classList.add('pf-v6-theme-dark');
                localStorage.setItem('ansibleclaw-theme', 'dark');
            }
            applyUI();
        }

        applyUI();
        btn.addEventListener('click', toggle);
    })();
    </script>
</body>
</html>

<table class="pf-v6-c-table pf-m-grid-md" role="grid" aria-label="Search results">
    <thead>
        <tr role="row">
            <th role="columnheader" scope="col">Module</th>
            <th role="columnheader" scope="col">Description</th>
            <th role="columnheader" scope="col">Actions</th>
        </tr>
    </thead>
    <tbody role="rowgroup">
        {% for name, desc in results.items() | sort %}
        <tr role="row">
            <td role="cell" data-label="Module"><code>{{ name }}</code></td>
            <td role="cell" data-label="Description">{{ desc or "" }}</td>
            <td role="cell" data-label="Actions">
                <div class="ac-action-row">
                    <button
                        class="pf-v6-c-button pf-m-secondary pf-m-small"
                        hx-get="/search/detail/{{ name }}"
                        hx-target="#module-detail"
                        hx-swap="innerHTML">
                        Details
                    </button>
                    <a href="/generate?module={{ name }}" class="pf-v6-c-button pf-m-link pf-m-small">
                        Generate Skill
                    </a>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<p style="margin-top:0.5rem;"><small>{{ results | length }} module(s) found.</small></p>
